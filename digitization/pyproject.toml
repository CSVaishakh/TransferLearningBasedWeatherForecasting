[project]
name = "sjcet-digitization"
version = "0.1.0"
description = "SJCET weather-register digitization: cell OCR and table assembly"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44,<5",
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pdf2image>=1.17",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
]

[tool.uv]
package = false

# CPU-only PyTorch: the laptop's AMD GPU cannot run CUDA
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
